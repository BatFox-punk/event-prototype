<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMP Event groups – prototype</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1B2414;font-size:14px}
.s-3gpp{--p:#3B7A16;--pd:#2F6610;--ps:#E6F2DA;--acc:#A6C730;--bg:#F3F5F0;--hv:#F7FAF3}
.s-etsi{--p:#1D5FA8;--pd:#154A85;--ps:#E1EBF7;--acc:#4FA3E3;--bg:#F1F4F8;--hv:#F3F7FC}
#app{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
a{color:var(--pd)}a:hover{color:#1B2414}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px;width:100%}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:0 16px;min-height:40px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid #CBD3C3;background:#fff;color:#1B2414;white-space:nowrap}
.btn:hover{background:var(--hv)}
.btn-p{background:var(--p);border-color:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-d{color:#A61B12;border-color:#E9C6C2}.btn-d:hover{background:#FCEFEE}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:help;text-transform:none}
.tip:hover,.tip:focus-visible{background:#EEF1EA;outline:0}
.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1B2414;color:#fff;font-size:12px;font-weight:500;letter-spacing:0;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:30;pointer-events:none}
.ttip{position:relative}
.ttip:hover::after,.ttip:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;background:#1B2414;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:30;pointer-events:none}
.gl{text-align:center;border-bottom:2px solid #CBD3C3;padding-bottom:4px}
.nv{display:inline-flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.inp:focus-visible,.row:focus-visible,.seg:focus-visible,.tile:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.inp{font:inherit;font-size:14px;border:1px solid #CBD3C3;border-radius:8px;padding:0 12px;min-height:40px;background:#fff;color:#1B2414;width:100%}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.inp:disabled{background:#F1F3EE;color:#6B7465}
.seg{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;padding:0 14px;min-height:36px;border-radius:6px;cursor:pointer;color:#4A5245}
.seg.on{background:#fff;color:#1B2414;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.segs{display:flex;gap:2px;background:#F1F3EE;border-radius:8px;padding:3px}
.card{background:#fff;border:1px solid #DDE3D6;border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:#5B6655;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.muted{color:#5B6655}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;justify-self:start}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;justify-self:start}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
h2{margin:0;font-size:17px;font-weight:700}
label{font-size:13px;font-weight:600;color:#3A4334}
.scroll{overflow-x:auto}
.thead{display:grid;gap:16px;padding:12px 20px;background:#F7F9F4;border-bottom:1px solid #DDE3D6;font-size:12px;font-weight:600;color:#5B6655;text-transform:uppercase;letter-spacing:.4px}
.glist{grid-template-columns:minmax(0,2.3fr) minmax(150px,1.2fr) minmax(0,1fr) minmax(0,1.2fr) 80px 64px 64px 64px 64px 140px 24px}
.mlist{grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) 64px 64px 64px 64px 96px;gap:12px}
.row{font:inherit;text-align:left;width:100%;border:0;border-bottom:1px solid #EEF1EA;background:#fff;cursor:pointer;color:inherit;display:grid;gap:16px;align-items:center;padding:16px 20px}
.row:hover{background:var(--hv)}
.mrow{display:grid;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid #EEF1EA}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;background:#EEF1EA;overflow:hidden}
dl.kv{margin:0;display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
dl.kv dt{color:#5B6655}dl.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}
.tile{font:inherit;text-align:left;cursor:pointer;background:#fff;color:inherit;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;border:1px solid #DDE3D6;margin:1px}
.tile.on{border:2px solid var(--p);background:var(--hv);margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2414;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.sr{position:absolute;left:-9999px}

.mt{display:grid;grid-template-columns:40px minmax(0,1.3fr) 1.1fr minmax(0,1fr) minmax(0,1.2fr) 112px 112px 64px 180px 230px;gap:14px;align-items:center}
.mcard{background:#fff;border:1px solid #DDE3D6;border-radius:12px;overflow:hidden;transition:box-shadow .15s}
.mcard:hover{box-shadow:0 2px 10px rgba(30,50,15,.08)}
.mcard.open{border-color:var(--p)}
.mhead{padding:12px 16px}
.ibtn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;color:#4A5245;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:hover{background:var(--ps);color:var(--pd)}
.ibtn:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.chev{transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#F1F3EE;color:#3A4334;border:0;font-family:inherit}
button.chip{cursor:pointer}button.chip:hover{background:var(--ps);color:var(--pd)}
</style>

        '<button class="btn" data-act="site" data-arg="P3GP" style="margin-top:8px">View the P3GP portal</button></div></main>' +
        (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
      if (fid) { var el0 = document.getElementById(fid); if (el0) el0.focus(); }
      return;
    }
    app.innerHTML = proto +
      '<header style="background:#fff">' +
      '<div class="wrap" style="padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px">' +
      '<div style="display:flex;align-items:flex-end;gap:20px"><div style="display:flex;flex-direction:column;line-height:1"><span style="font-size:34px;font-weight:800;letter-spacing:-2px;color:#1B2414">P3GP</span><span style="font-size:8px;letter-spacing:2.4px;color:#3A4334;margin-top:4px">A GLOBAL INITIATIVE</span></div>' +
      '<span style="font-size:30px;font-weight:600;color:#1B2414;font-family:inherit;letter-spacing:-.5px">Portal</span></div>' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px">' +
      '<div style="display:flex;flex-direction:column;align-items:center;font-size:11px;color:#3A4334"><span>' + clock + '</span><span>Sophia Antipolis - France</span></div>' +
      '<span style="font-size:13px;color:#3A4334">Welcome <strong>Olga Kozlova</strong></span>' +
      '<button class="btn" data-act="noop" data-arg="Logout" style="min-height:34px;font-size:13px">Logout</button></div></div>' +
      '<div class="wrap" style="display:flex;flex-wrap:wrap;gap:8px 24px;padding-bottom:10px">' +
      '<button data-act="noop" data-arg="Select TSG/WG" style="font:inherit;font-size:13px;font-weight:700;color:#fff;background:#3F8314;border:0;border-radius:6px;min-height:40px;padding:0 16px;flex:0 1 215px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer">Select TSG/WG<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9l6 6 6-6z"/></svg></button>' +
      '<nav aria-label="Portal menu" style="flex:1 1 400px;background:#3F8314;border-radius:6px;display:flex;flex-wrap:wrap;align-items:center;padding:0 8px">' +
      MENU.map(function (m) { return '<button data-act="noop" data-arg="' + m + '" style="font:inherit;font-size:13px;font-weight:700;color:#fff;background:transparent;border:0;min-height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">' + (m === 'Directory' ? '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>' : '') + m + '</button>'; }).join('') +
      '</nav></div>' +
      '<div style="border-bottom:1px solid #C9D9B4"><div class="wrap scroll"><nav aria-label="Sections" style="display:flex;gap:3px;padding-top:4px">' +
      TABS.map(function (t) {
        var on = (t === 'Events' && S.view !== 'meetings') || (t === 'Meetings' && S.view === 'meetings');
        return '<button data-act="' + (t === 'Meetings' || t === 'Events' ? 'go' : 'noop') + '" data-arg="' + (t === 'Meetings' ? 'meetings' : t === 'Events' ? 'list' : t) + '"' + (on ? ' aria-current="page"' : '') + ' style="font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;min-height:40px;padding:0 16px;border-radius:6px 6px 0 0;margin-bottom:-1px;' +
          (on ? 'background:#fff;color:#2F6610;border:1px solid #C9D9B4;border-bottom-color:#fff' : 'background:#3F8314;color:#fff;border:1px solid #3F8314') + '">' + t + '</button>';
      }).join('') +
      '</nav></div></div>' +
      
      '</header>' +
      '<main class="wrap" style="flex:1;padding-top:20px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px">' + body + '</main>' +
      (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, ss); } catch (e) {} } }
  }

  var A = {
    mperiod: function (p) { S.mPeriod = p; },
    mreset: function () { S.mGroup = 'All'; S.mLoc = 'All'; S.mPeriod = '1y'; S.mSort = 'date'; S.mOrder = 'asc'; S.mQuery = ''; },
    mtoggle: function (id) { S.mOpen[id] = !S.mOpen[id]; },
    newMeeting: function () { S.newType = 'standalone'; S.view = 'new'; },
    exportMtg: function () { flash('meetings_list.xlsx exported (' + mtgInfo.length + ' meetings).'); return true; },
    exportOne: function (id) { var m = mtgInfo.find(function (x) { return x.id === id; }); flash((m ? m.ref : 'Meeting') + '_participants.xlsx exported (' + (m ? fmt(m.f2f) + ' face to face, ' + fmt(m.online) + ' online' : '') + ').'); return true; },
    noop: function (what) { flash(what + ' is not part of this prototype.'); return true; },
    go: function (v) { S.view = v; S.addOpen = false; },
    site: function (s) { S.site = s; S.view = 'list'; S.selId = null; S.addOpen = false; },
    period: function (p) { S.period = p; },
    open: function (id) { S.view = 'detail'; S.selId = id; S.addOpen = false; S.k4eEventInput = ''; S.k4eKey = ''; S.k4eStatus = 'none'; },
    exportAll: function () { flash('events_list.xlsx exported (' + exportInfo.n + ' groups, ' + exportInfo.m + ' meetings).'); return true; },
    exportParticipants: function () { var g = sel(); flash(g.title + '_participants_per_meeting.xlsx exported (' + g.meetings.length + ' meetings, ' + fmt(sum(g.meetings, 'f2f') + sum(g.meetings, 'online')) + ' registered participants).'); return true; },
    toggleAdd: function () { S.addOpen = !S.addOpen; },
    toggleNotify: function () { S.notify = !S.notify; },
    createInGroup: function () { flash('Opens the meeting form with the group values pre-filled. Breadcrumb: ' + sel().title); return true; },
    cloneFirst: function () { var g = sel(); flash('Opens a copy of ' + g.meetings[0].ref + ' to adjust body, title and dates.'); return true; },
    link: function (id) {
      var g = sel(), p = S.pool.find(function (x) { return x.id === id; });
      upd(function (x) { return Object.assign({}, x, { meetings: x.meetings.concat([p]) }); });
      S.pool = S.pool.filter(function (x) { return x.id !== id; });
      flash(p.ref + ' linked to the group.' + (g.family === 'ISET' && S.notify ? ' Registered participants will be notified.' : '')); return true;
    },
    detach: function (id) {
      var g = sel(), m = g.meetings.find(function (x) { return x.id === id; });
      upd(function (x) { return Object.assign({}, x, { meetings: x.meetings.filter(function (y) { return y.id !== id; }) }); });
      S.pool = S.pool.concat([Object.assign({}, m, { family: g.family })]);
      flash(m.ref + ' detached. It is now a standalone meeting.'); return true;
    },
    connectK4e: function () {
      var k = S.k4eKey.trim();
      if (k.length < 8) { S.k4eStatus = 'error'; return; }
      upd(function (x) { return Object.assign({}, x, { k4e: { linked: true, provider: 'Key4Events', keyMask: '•••• ' + k.slice(-4).toUpperCase(), sync: stamp() } }); });
      S.k4eKey = ''; S.k4eStatus = 'none'; flash('Connected to Key4Events. First sync done.'); return true;
    },
    syncK4e: function () { upd(function (x) { return Object.assign({}, x, { k4e: Object.assign({}, x.k4e, { sync: stamp() }) }); }); flash('Key4Events synchronised.'); return true; },
    unlinkK4e: function () { upd(function (x) { return Object.assign({}, x, { k4e: { linked: false } }); }); S.k4eKey = ''; flash('Integration disconnected.'); return true; },
    newType: function (t) { S.newType = t; },
    openStandalone: function () { flash('Opens the current Meetings Management form.'); return true; },
    createGroup: function () {
      var id = 'g' + Date.now();
      var ng = { id: id, title: S.newTitle.trim(), family: S.site, kind: S.newType === 'egroup' ? 'Event group' : 'Meeting group', start: S.newStart, end: S.newEnd, location: S.newLoc.trim() || 'To be defined', regStart: 'As soon as published', regClose: 'not set', contact: 'Olga Kozlova', status: 'upcoming', k4e: { linked: false }, meetings: [] };
      S.groups = [ng].concat(S.groups); S.view = 'detail'; S.selId = id; S.addOpen = true; S.newTitle = S.newLoc = S.newStart = S.newEnd = '';
      flash(ng.kind + ' created. Add its first meeting.'); return true;
    },
    testK4e: function () { if (S.k4eKey.trim().length >= 8) { S.k4eStatus = 'ok'; flash('Key4Events connected.'); return true; } S.k4eStatus = 'error'; },
    disconnectK4e: function () { S.k4eStatus = 'none'; S.k4eKey = ''; flash('Key4Events disconnected.'); return true; }
  };

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    if (t.tagName === 'A') e.preventDefault();
    var done = A[t.getAttribute('data-act')](t.getAttribute('data-arg'));
    if (!done) render();
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-model');
    if (!k) return;
    S[k] = e.target.value;
    if (e.target.hasAttribute('data-rerender')) render();
  });
  render();
})();
</script>
</body>
