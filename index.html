<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMP Event groups – prototype</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1B2414;font-size:14px}
.s-3gpp{--p:#3B7A16;--pd:#2F6610;--ps:#E6F2DA;--acc:#A6C730;--bg:#F3F5F0;--hv:#F7FAF3}
.s-etsi{--p:#1D5FA8;--pd:#154A85;--ps:#E1EBF7;--acc:#4FA3E3;--bg:#F1F4F8;--hv:#F3F7FC}
#app{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
a{color:var(--pd)}a:hover{color:#1B2414}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px;width:100%}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:0 16px;min-height:40px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid #CBD3C3;background:#fff;color:#1B2414;white-space:nowrap}
.btn:hover{background:var(--hv)}
.btn-p{background:var(--p);border-color:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-d{color:#A61B12;border-color:#E9C6C2}.btn-d:hover{background:#FCEFEE}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.inp:focus-visible,.row:focus-visible,.seg:focus-visible,.tile:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.inp{font:inherit;font-size:14px;border:1px solid #CBD3C3;border-radius:8px;padding:0 12px;min-height:40px;background:#fff;color:#1B2414;width:100%}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.inp:disabled{background:#F1F3EE;color:#6B7465}
.seg{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;padding:0 14px;min-height:36px;border-radius:6px;cursor:pointer;color:#4A5245}
.seg.on{background:#fff;color:#1B2414;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.segs{display:flex;gap:2px;background:#F1F3EE;border-radius:8px;padding:3px}
.card{background:#fff;border:1px solid #DDE3D6;border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:#5B6655;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.muted{color:#5B6655}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;justify-self:start}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;justify-self:start}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
h2{margin:0;font-size:17px;font-weight:700}
label{font-size:13px;font-weight:600;color:#3A4334}
.scroll{overflow-x:auto}
.thead{display:grid;gap:16px;padding:12px 20px;background:#F7F9F4;border-bottom:1px solid #DDE3D6;font-size:12px;font-weight:600;color:#5B6655;text-transform:uppercase;letter-spacing:.4px}
.glist{grid-template-columns:84px minmax(0,2.6fr) 1.3fr 90px 90px 90px 170px 24px}
.mlist{grid-template-columns:minmax(0,1.4fr) 1.2fr minmax(0,1.4fr) 2fr 96px}
.row{font:inherit;text-align:left;width:100%;border:0;border-bottom:1px solid #EEF1EA;background:#fff;cursor:pointer;color:inherit;display:grid;gap:16px;align-items:center;padding:16px 20px}
.row:hover{background:var(--hv)}
.mrow{display:grid;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid #EEF1EA}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;background:#EEF1EA;overflow:hidden}
dl.kv{margin:0;display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
dl.kv dt{color:#5B6655}dl.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}
.tile{font:inherit;text-align:left;cursor:pointer;background:#fff;color:inherit;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;border:1px solid #DDE3D6;margin:1px}
.tile.on{border:2px solid var(--p);background:var(--hv);margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2414;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app" class="s-3gpp"></div>
<script>
(function () {

      { id: 'g2', title: '2026-02-Goteborg-RAN WGs', family: 'P3GP', kind: 'Meeting group', start: '2026-02-09', end: '2026-02-13', location: GOT, regStart: 'As soon as published', regClose: '26 Jan 2026', contact: 'Meeting support (ISET)', status: 'ended', k4e: { linked: true, id: '48213', sync: '13 Feb 2026, 18:02' },
        meetings: [M('m10','P3GPRAN1#124','P3GP RAN 1','2026-02-09','2026-02-13',GOT,926,305,699,0), M('m11','P3GPRAN2#133','P3GP RAN 2','2026-02-09','2026-02-13',GOT,538,169,446,0), M('m12','P3GPRAN3#131','P3GP RAN 3','2026-02-09','2026-02-13',GOT,326,50,279,0), M('m13','P3GPRAN4#118','P3GP RAN 4','2026-02-09','2026-02-13',GOT,462,47,383,0), M('m14','P3GPRAN5#110','P3GP RAN 5','2026-02-09','2026-02-13',GOT,198,34,170,0)] }

    h += '<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start"><div style="flex:999 1 640px;min-width:0"><section class="card" style="overflow:hidden">' +

      if (!pool.length) h += '<span class="muted" style="font-size:13px">No standalone ' + g.family + ' meeting available.</span>';
      h += '</div>' + (isEtsi
        ? '<label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" data-act="toggleNotify"' + (S.notify ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--p)"> Notify registered participants when a meeting is added</label>'
        : '<span class="muted" style="font-size:13px">P3GP: no group-level notification is sent. Participants keep registering per meeting.</span>') + '</div>';
    }
    h += '<div class="scroll"><div style="min-width:760px"><div class="thead mlist" style="border-bottom:0"><span>Meeting</span><span>Dates</span><span>Location</span><span>Participants (F2F / online)</span><span></span></div>';
    g.meetings.forEach(function (m) {
      h += '<div class="mrow mlist"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600">' + m.ref + '</span><span class="muted" style="font-size:12px">' + m.body + '</span></span>' +
        '<span style="font-size:13px">' + range(m.start, m.end) + '</span><span class="ell" style="font-size:13px;color:#3A4334">' + m.location + '</span>' +
        '<span style="display:flex;flex-direction:column;gap:6px"><span class="bar"><span style="width:' + (m.f2f / maxT * 100).toFixed(1) + '%;background:#2563B0"></span><span style="width:' + (m.online / maxT * 100).toFixed(1) + '%;background:#D9822B"></span></span>' +
        '<span style="font-size:12px;color:#3A4334"><strong style="color:#1F4F8F">' + fmt(m.f2f) + '</strong> F2F · <strong style="color:#8A4510">' + fmt(m.online) + '</strong> online' + (locked ? ' · attended ' + fmt(m.attF2f) + ' / ' + fmt(m.attOnline) : '') + '</span></span>' +
        '<span style="justify-self:end">' + (locked ? '' : '<button class="btn btn-d btn-sm" data-act="detach" data-arg="' + m.id + '" aria-label="Detach ' + m.ref + ' from the group">Detach</button>') + '</span></div>';
    });
    if (!g.meetings.length) h += '<div class="muted" style="padding:32px 20px;text-align:center;border-top:1px solid #EEF1EA">No meeting in this group yet. Use Add meeting to create or link one.</div>';
    h += '</div></div></section></div>';

    h += '<aside style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px"><section class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px"><h2>Group details</h2><dl class="kv">' +
      '<dt>Body family</dt><dd>' + g.family + '</dd><dt>Location</dt><dd>' + esc(g.location) + '</dd><dt>Contact</dt><dd>' + esc(g.contact) + '</dd>' +
      '<dt>Visibility</dt><dd>' + (isEtsi ? 'Shown in the ISET calendar as one entry' : 'Internal only (staff and hosting partners)') + '</dd><dt>Registration</dt><dd>' + (isEtsi ? 'Bulk registration for the whole group' : 'Per meeting, as today') + '</dd></dl></section>';
    h += '<section class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2>Key4Events</h2>' + (g.k4e.linked ? '<span class="pill" style="background:#E6F2DA;color:#2F6610">Linked</span>' : '') + '</div>';
    if (g.k4e.linked) {
      h += '<dl class="kv"><dt>Event ID</dt><dd style="font-weight:600">' + esc(g.k4e.id) + '</dd><dt>Last sync</dt><dd>' + g.k4e.sync + '</dd><dt>Data shared</dt><dd>Meeting list, F2F participants</dd></dl>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" data-act="syncK4e"' + dis(!k4eOn) + '>Sync now</button><button class="btn btn-d" data-act="unlinkK4e"' + dis(locked) + '>Unlink</button></div>' +
        (k4eOn ? '' : '<p class="muted" style="margin:0;font-size:13px">Reconnect Key4Events in Integrations to sync.</p>');
    } else if (!k4eOn) {
      h += '<p class="muted" style="margin:0;font-size:13px">Key4Events is not connected. Add your API key first.</p><button class="btn" data-act="go" data-arg="settings" style="align-self:flex-start">Open Integrations</button>';
    } else {
      h += '<label for="k4eid">Key4Events event ID</label><input id="k4eid" class="inp" placeholder="e.g. 48213" value="' + esc(S.k4eEventInput) + '" data-model="k4eEventInput" data-rerender="1"' + dis(locked) + '>' +
        '<button class="btn btn-p" data-act="linkK4e" style="align-self:flex-start"' + dis(locked || !S.k4eEventInput.trim()) + '>Link this group</button>';
    }
    h += '</section></aside></div>';
    return h;
  }

  function viewNew() {
    var isEtsi = S.site === 'ISET', it = isEtsi ? ' (P3GP only)' : '';
    var T = [['standalone', 'Standalone meeting', 'One meeting or event, not linked to a group. Uses the current creation process.'], ['mgroup', 'Meeting group', 'Groups body-related meetings (WGs, TCs) that share dates, location and participants.'], ['egroup', 'Event group', 'Groups activity-related events, open to external users by default.']];
    var h = '<div style="display:flex;flex-direction:column;gap:4px"><h1>New</h1><p class="muted" style="margin:0">Choose what you want to create</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">';
    T.forEach(function (t) { h += '<button class="tile' + (S.newType === t[0] ? ' on' : '') + '" data-act="newType" data-arg="' + t[0] + '" aria-pressed="' + (S.newType === t[0]) + '"><span style="font-size:16px;font-weight:700">' + t[1] + '</span><span class="muted" style="font-size:13px;line-height:1.5">' + t[2] + '</span></button>'; });
    h += '</div>';
    if (S.newType === 'standalone') return h + '<div class="card" style="padding:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px"><span>A standalone meeting uses the current creation process. You can link it to a group later.</span><button class="btn btn-p" data-act="openStandalone">Continue to meeting form</button></div>';
    function f(id, lbl, inner, full) { return '<div class="field' + (full ? ' full' : '') + '"><label for="' + id + '">' + lbl + '</label>' + inner + '</div>'; }
    h += '<section class="card" style="padding:24px;display:flex;flex-direction:column;gap:20px"><h2>' + (S.newType === 'egroup' ? 'Event group' : 'Meeting group') + ': level 1 details</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px 20px">' +
      f('nt', 'Title (also the badge title) *', '<input id="nt" class="inp" placeholder="e.g. 2027-August-EU-RAN WGs" value="' + esc(S.newTitle) + '" data-model="newTitle" data-rerender="1">', true) +
      '<div class="field"><span style="font-size:13px;font-weight:600;color:#3A4334">Body family</span><span style="display:flex;align-items:center;gap:8px;min-height:40px"><span class="tag" style="background:var(--ps);color:var(--pd)">' + S.site + '</span>Set by this portal</span></div>' +
      f('nl', 'Location *', '<input id="nl" class="inp" placeholder="City, country or ISET premises" value="' + esc(S.newLoc) + '" data-model="newLoc">') +
      f('ns', 'Start date *', '<input id="ns" class="inp" type="date" value="' + esc(S.newStart) + '" data-model="newStart">') +
      f('ne', 'End date *', '<input id="ne" class="inp" type="date" value="' + esc(S.newEnd) + '" data-model="newEnd">') +
      f('rs', 'Registration start', '<select id="rs" class="inp"><option>As soon as published</option><option>At a specified date/time</option></select>') +
      f('rc', 'Registration closure', '<input id="rc" class="inp" type="date">') +
      f('mc', 'Event / meeting contact(s)', '<input id="mc" class="inp" placeholder="Search a contact">') +
      f('it', 'IT support' + it, '<input id="it" class="inp" placeholder="Search an IT support person"' + dis(isEtsi) + '>') +
      f('sv', 'Satisfaction survey URL' + it, '<input id="sv" class="inp" placeholder="https://…"' + dis(isEtsi) + '>', true) +
      f('ai', 'Additional information', '<textarea id="ai" class="inp" placeholder="Displayed on the group page"></textarea>', true) +
      '</div><p class="muted" style="margin:0;font-size:13px">Meetings created inside this group inherit its dates, registration window, location and contacts. Each value stays editable per meeting.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end"><button class="btn" data-act="go" data-arg="list">Cancel</button><button class="btn btn-p" data-act="createGroup"' + dis(!S.newTitle.trim()) + '>Create group and add meetings</button></div></section>';
    return h;
  }

  function viewSettings() {
    var on = S.k4eStatus === 'ok';
    var h = '<div style="display:flex;flex-direction:column;gap:4px"><h1>Integrations</h1><p class="muted" style="margin:0">Connect external event management tools</p></div>' +
      '<section class="card" style="padding:24px;display:flex;flex-direction:column;gap:18px;max-width:760px"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px"><div style="display:flex;align-items:center;gap:12px">' +
      '<div aria-hidden="true" style="width:40px;height:40px;border-radius:10px;background:#E3ECF8;color:#1D4E89;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">K4E</div><div style="display:flex;flex-direction:column"><h2>Key4Events</h2><span class="muted" style="font-size:13px">External registration and venue management for hosted events</span></div></div>' +
      '<span class="pill" style="' + (on ? 'background:#E6F2DA;color:#2F6610' : 'background:#ECEEEA;color:#4A5245') + '">' + (on ? 'Connected' : 'Not connected') + '</span></div>';
    if (!on) {
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px"><div class="field full"><label for="key">API key</label><input id="key" class="inp" type="password" autocomplete="off" placeholder="Paste the API key from your Key4Events account" value="' + esc(S.k4eKey) + '" data-model="k4eKey" data-rerender="1"></div>' +
        '<div class="field"><label for="env">Environment</label><select id="env" class="inp"><option>Production</option><option>Sandbox</option></select></div></div>' +
        (S.k4eStatus === 'error' ? '<p role="alert" style="margin:0;font-size:13px;color:#A61B12">The key was rejected. Check it in Key4Events and try again.</p>' : '') +
        '<div><button class="btn btn-p" data-act="testK4e"' + dis(!S.k4eKey.trim()) + '>Test and save connection</button></div>';
    } else {
      var mask = S.k4eKey.length > 4 ? '•••• •••• ' + esc(S.k4eKey.slice(-4)) : '••••';
      var cb = function (t, c) { return '<label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox"' + (c ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--p)"> ' + t + '</label>'; };
      h += '<dl class="kv" style="grid-template-columns:160px 1fr;font-size:14px"><dt>API key</dt><dd style="font-family:ui-monospace,monospace">' + mask + '</dd><dt>Connected by</dt><dd>Olga Kozlova</dd><dt>Linked groups</dt><dd>' + S.groups.filter(function (x) { return x.k4e.linked; }).length + '</dd></dl>' +
        '<fieldset style="border:1px solid #DDE3D6;border-radius:10px;padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:10px"><legend style="font-size:13px;font-weight:600;padding:0 6px">Synchronisation</legend>' +
        cb('Push the meeting list of linked groups', true) + cb('Share face-to-face participant lists with the host', true) + cb('Import on-site attendance back into MMP', false) + '</fieldset>' +
        '<p class="muted" style="margin:0;font-size:13px">Sharing participant data with a host requires the GDPR agreement for that event.</p><div><button class="btn btn-d" data-act="disconnectK4e">Disconnect</button></div>';
    }
    return h + '</section>';
  }

  var app = document.getElementById('app');
  function render() {
    var ae = document.activeElement, fid = ae && ae.id, ss = null;
    try { ss = ae && ae.selectionStart; } catch (e) {}
    app.className = S.site === 'ISET' ? 's-etsi' : 's-3gpp';
    var nav = function (v, l) { var on = S.view === v || (v === 'list' && S.view === 'detail'); return '<button class="seg" data-act="go" data-arg="' + v + '" style="' + (on ? 'background:var(--ps);color:var(--pd)' : '') + '">' + l + '</button>'; };
    var body = S.view === 'detail' ? viewDetail() : S.view === 'new' ? viewNew() : S.view === 'settings' ? viewSettings() : viewList();
    app.innerHTML =
      '<div style="background:#1B2414;color:#E8ECE4;font-size:12px"><div class="wrap" style="padding-top:6px;padding-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px"><span>Prototype · view as portal:</span>' +
      '<div role="group" aria-label="Portal" style="display:flex;gap:2px;background:#333C2D;border-radius:6px;padding:2px">' +
      ['P3GP', 'ISET'].map(function (s) { return '<button class="seg" data-act="site" data-arg="' + s + '" style="min-height:28px;font-size:12px;' + (S.site === s ? 'background:#fff;color:#1B2414' : 'color:#E8ECE4') + '">' + s + '</button>'; }).join('') +
      '</div><span style="color:#B8C0B2">Shared back end: same groups, meetings and participants database</span></div></div>' +
      '<header style="background:#fff;border-bottom:1px solid #DDE3D6"><div class="wrap" style="padding-top:12px;padding-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px">' +
      '<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:36px;border-radius:9px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">' + S.site + '</div><div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:15px">' + S.site + ' Portal</span><span class="muted" style="font-size:12px">Meetings Management</span></div></div>' +
      '<nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto">' + nav('list', 'Events') + nav('new', 'New') + nav('settings', 'Integrations') + '</nav>' +
      '<div style="display:flex;align-items:center;gap:10px"><span class="muted" style="font-size:13px">Olga Kozlova</span><div aria-hidden="true" style="width:32px;height:32px;border-radius:50%;background:var(--ps);color:var(--pd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">OK</div></div></div>' +
      '<div aria-hidden="true" style="height:3px;background:var(--acc)"></div></header>' +
      '<main class="wrap" style="flex:1;padding-top:28px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px">' + body + '</main>' +
      (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, ss); } catch (e) {} } }
  }

  var A = {
    go: function (v) { S.view = v; S.addOpen = false; },
    site: function (s) { S.site = s; S.view = 'list'; S.selId = null; S.addOpen = false; },
    period: function (p) { S.period = p; },
    open: function (id) { S.view = 'detail'; S.selId = id; S.addOpen = false; S.k4eEventInput = ''; },
    exportAll: function () { flash('events_list.xlsx exported (' + exportInfo.n + ' groups, ' + exportInfo.m + ' meetings).'); return true; },
    exportMeetings: function () { var g = sel(); flash(g.title + '_meetings.xlsx exported (' + g.meetings.length + ' meetings).'); return true; },
    exportParticipants: function () { var g = sel(); flash(g.title + '_participants.xlsx exported (' + fmt(sum(g.meetings, 'f2f')) + ' registered face to face, ' + fmt(sum(g.meetings, 'online')) + ' registered online, ' + fmt(sum(g.meetings, 'attF2f')) + ' attended face to face, ' + fmt(sum(g.meetings, 'attOnline')) + ' attended online).'); return true; },
    editGroup: function () { flash('Opens the group details form (same fields as New › ' + sel().kind + ').'); return true; },
    toggleAdd: function () { S.addOpen = !S.addOpen; },
    toggleNotify: function () { S.notify = !S.notify; },
    createInGroup: function () { flash('Opens the meeting form with the group values pre-filled. Breadcrumb: ' + sel().title); return true; },
    cloneFirst: function () { var g = sel(); flash('Opens a copy of ' + g.meetings[0].ref + ' to adjust body, title and dates.'); return true; },
    link: function (id) {
      var g = sel(), p = S.pool.find(function (x) { return x.id === id; });
      upd(function (x) { return Object.assign({}, x, { meetings: x.meetings.concat([p]) }); });
      S.pool = S.pool.filter(function (x) { return x.id !== id; });
      flash(p.ref + ' linked to the group.' + (g.family === 'ISET' && S.notify ? ' Registered participants will be notified.' : '')); return true;
    },
    detach: function (id) {
      var g = sel(), m = g.meetings.find(function (x) { return x.id === id; });
      upd(function (x) { return Object.assign({}, x, { meetings: x.meetings.filter(function (y) { return y.id !== id; }) }); });
      S.pool = S.pool.concat([Object.assign({}, m, { family: g.family })]);
      flash(m.ref + ' detached. It is now a standalone meeting.'); return true;
    },
    linkK4e: function () { var id = S.k4eEventInput.trim(); upd(function (x) { return Object.assign({}, x, { k4e: { linked: true, id: id, sync: stamp() } }); }); S.k4eEventInput = ''; flash('Group linked to Key4Events event ' + id + '. First sync done.'); return true; },
    syncK4e: function () { upd(function (x) { return Object.assign({}, x, { k4e: Object.assign({}, x.k4e, { sync: stamp() }) }); }); flash('Key4Events synchronised.'); return true; },
    unlinkK4e: function () { upd(function (x) { return Object.assign({}, x, { k4e: { linked: false } }); }); flash('Group unlinked from Key4Events.'); return true; },
    newType: function (t) { S.newType = t; },
    openStandalone: function () { flash('Opens the current Meetings Management form.'); return true; },
    createGroup: function () {
      var id = 'g' + Date.now();
      var ng = { id: id, title: S.newTitle.trim(), family: S.site, kind: S.newType === 'egroup' ? 'Event group' : 'Meeting group', start: S.newStart, end: S.newEnd, location: S.newLoc.trim() || 'To be defined', regStart: 'As soon as published', regClose: 'not set', contact: 'Olga Kozlova', status: 'upcoming', k4e: { linked: false }, meetings: [] };
      S.groups = [ng].concat(S.groups); S.view = 'detail'; S.selId = id; S.addOpen = true; S.newTitle = S.newLoc = S.newStart = S.newEnd = '';
      flash(ng.kind + ' created. Add its first meeting.'); return true;
    },
    testK4e: function () { if (S.k4eKey.trim().length >= 8) { S.k4eStatus = 'ok'; flash('Key4Events connected.'); return true; } S.k4eStatus = 'error'; },
    disconnectK4e: function () { S.k4eStatus = 'none'; S.k4eKey = ''; flash('Key4Events disconnected.'); return true; }
  };

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    if (t.tagName === 'A') e.preventDefault();
    var done = A[t.getAttribute('data-act')](t.getAttribute('data-arg'));
    if (!done) render();
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-model');
    if (!k) return;
    S[k] = e.target.value;
    if (e.target.hasAttribute('data-rerender')) render();
  });
  render();
})();
</script>
</body>
</html>
